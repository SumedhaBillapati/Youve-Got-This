<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>You've got this</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px; box-sizing: border-box; text-align: center;
      font-family: system-ui, -apple-system, sans-serif; color: #fff;
      background: linear-gradient(135deg, #ff6a88, #ff99ac, #fcb69f);
    }
    #emoji { font-size: 72px; animation: pop 0.6s ease-out; }
    h1 {
      font-size: 46px; line-height: 1.15; margin: 16px 0 24px; max-width: 640px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2); animation: pop 0.6s ease-out;
    }
    .nudge {
      background: rgba(255,255,255,0.25); border-radius: 16px;
      padding: 14px 22px; font-size: 20px; margin-bottom: 28px;
    }
    .nudge b { display: block; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.9; margin-bottom: 4px; }
    .buttons { display: flex; gap: 12px; }
    button {
      border: none; border-radius: 999px; padding: 12px 24px;
      font-size: 17px; font-weight: 600; cursor: pointer;
      background: #fff; color: #ff6a88;
    }
    button.ghost { background: transparent; color: #fff; border: 2px solid #fff; }
    button:hover { transform: scale(1.05); }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="emoji"></div>
  <h1 id="message"></h1>
  <div class="nudge"><b>Right now</b><span id="nudge"></span></div>
  <div class="buttons">
    <button id="done">I'm on it ✅</button>
    <button id="again" class="ghost">Another one 🔁</button>
  </div>
  <script src="messages.js"></script>
  <script src="reminder.js"></script>
</body>
</html>
