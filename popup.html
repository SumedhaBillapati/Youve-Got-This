<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 28px 20px;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ff6a88, #ff99ac, #fcb69f);
      color: #fff;
    }
    #emoji {
      font-size: 44px;
      display: inline-block;
      animation: pop 0.5s ease-out;
    }
    h1 {
      font-size: 24px;
      line-height: 1.2;
      margin: 10px 0 18px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.2);
      animation: pop 0.5s ease-out;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      background: #fff;
      color: #ff6a88;
      cursor: pointer;
    }
    button:hover { transform: scale(1.05); }
    #next { font-size: 12px; margin: 14px 0 4px; opacity: 0.9; }
    #test { font-size: 12px; color: #fff; }
    @keyframes pop {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="emoji">💪</div>
  <h1 id="message">You've got this!!</h1>
  <button id="again">Again 🔁</button>
  <p id="next"></p>
  <a href="#" id="test">Preview the big reminder</a>

  <!-- Scripts must be in a separate file: Chrome extensions block inline JS -->
  <script src="messages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
